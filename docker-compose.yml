services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/synapseai
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_MODE: ${AI_MODE:-live}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      EVIDENCE_PROVIDER: ${EVIDENCE_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TRUST_PROXY: 'true'
    ports: ['4000:4000']

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:4000
    ports: ['3000:3000']

volumes:
  mongo-data:
