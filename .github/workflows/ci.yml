name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-used-in-production-0123

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  no-gradients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any gradient sneaks into the design system
        run: |
          if grep -rniE '(linear|radial|conic)-gradient|bg-gradient-' frontend/app frontend/components frontend/features frontend/styles; then
            echo "::error::SynapseAI is solid-colour only — no gradients allowed."
            exit 1
          fi
          echo "No gradients found."
